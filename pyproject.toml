[project]
name = "compressor-rl"
version = "0.1.0"
description = "Basınçlı hava sistemlerinde kompresör sıralama için pekiştirmeli öğrenme (simülasyon)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "matplotlib>=3.8",
    "tensorboard>=2.16",
    "tqdm",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compressor_env"]
